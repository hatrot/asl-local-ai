<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Secret Labo. - Local AI Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- サイドバー -->
    <aside class="sidebar">
      <div class="brand">
        <span class="logo-icon">🧪</span>
        <div class="brand-text">
          <h1>AI Secret Labo.</h1>
          <span class="version-tag">#01 Local Native</span>
        </div>
      </div>

      <div class="status-card">
        <div class="status-indicator online"></div>
        <div class="status-info">
          <span class="status-title">Metal GPU 稼働中</span>
          <span class="model-badge">Qwen 2.5 3B (4-bit)</span>
        </div>
      </div>

      <div class="sidebar-links">
        <a href="https://note.com/hatrot/m/m4801473bf6fa" target="_blank" class="sidebar-btn">
          <span>📚 note公式マガジン</span>
        </a>
      </div>
    </aside>

    <!-- メインチャット領域 -->
    <main class="chat-main">
      <header class="chat-header">
        <div class="header-title">
          <h2>手元AIチャット</h2>
          <span class="badge">完全ローカル・通信ゼロ</span>
        </div>
      </header>

      <div class="messages-container" id="messages-container">
        <div class="welcome-message">
          <div class="welcome-icon">⚡️</div>
          <h3>ようこそ、手元AIの秘密ラボへ</h3>
          <p>外部クラウドへの送信は1バイトもありません。MacのGPUパワーで爆速対話をお楽しみください。</p>
        </div>
      </div>

      <!-- 入力エリア -->
      <div class="input-container">
        <form id="chat-form" class="chat-input-box">
          <textarea
            id="chat-input"
            rows="1"
            placeholder="メッセージを入力... (Shift+Enter で送信, Enterで改行)"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="send-btn" class="send-btn" aria-label="送信">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
